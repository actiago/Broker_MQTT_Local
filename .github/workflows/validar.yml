name: validar

# Verificação de sanidade de cada push/PR: sintaxe dos scripts, shellcheck,
# o docker-compose.yml (com e sem PORTA_MQTT) e o parser do PowerShell.
# Não sobe broker nenhum, então roda em segundos.

on:
  push:
  pull_request:

jobs:
  scripts:
    name: scripts de shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: sintaxe (bash -n)
        run: |
          bash -n broker.sh
          bash -n apontar_framework.sh

      - name: shellcheck (somente erros)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version
          shellcheck -S error broker.sh apontar_framework.sh

  compose:
    name: docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: compose config (porta padrão)
        run: docker compose -f docker-compose.yml config

      - name: compose config (PORTA_MQTT=1884)
        run: |
          PORTA_MQTT=1884 docker compose -f docker-compose.yml config | grep -q '1884:1883'

      - name: mosquitto.conf existe e tem listener na 1883
        run: |
          test -f mosquitto/mosquitto.conf
          grep -qE '^listener 1883 0\.0\.0\.0' mosquitto/mosquitto.conf

  windows:
    name: scripts do Windows (parser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: sintaxe do broker.ps1
        shell: pwsh
        run: |
          $tokens = $null
          $erros = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            'windows/broker.ps1', [ref]$tokens, [ref]$erros)
          if ($erros -and $erros.Count -gt 0) {
            $erros | ForEach-Object {
              Write-Host "ERRO linha $($_.Extent.StartLineNumber): $($_.Message)"
            }
            exit 1
          }
          'windows/broker.ps1: sintaxe ok'
