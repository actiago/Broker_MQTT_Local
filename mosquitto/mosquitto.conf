# Broker MQTT local — Framework LoRa MQTT (Cobertura)
#
# Este arquivo é montado em /mosquitto/config/mosquitto.conf (somente leitura)
# pelo docker-compose.yml. Depois de editar, reinicie:
#
#   ./broker.sh restart

# ===========================================================================
# Rede
# ===========================================================================
# 0.0.0.0 (e não localhost) porque o Gateway ESP32 chega pela rede Wi-Fi: se o
# listener escutasse só em 127.0.0.1, o Python do N3 conectaria e a placa não.
listener 1883 0.0.0.0

# Sem usuário/senha: o Setup do framework (Setup_Parametros_MQTT.py) grava só
# broker, porta, tópicos, tempos e QoS — não existe campo de credenciais no N3
# nem no sketch do Gateway. Broker anônimo é aceitável numa rede de
# laboratório; NÃO exponha esta porta na internet (veja o README, §9).
allow_anonymous true

# -1 = conexões ilimitadas (N3, simulador, N5/N6 e o ESP32 ao mesmo tempo)
max_connections -1

# ===========================================================================
# Sessões e entrega em QoS 1
# ===========================================================================
# O framework usa QoS 1 (é o que o gateway confirma: "Pacote UL publicado via
# MQTT (QoS1)"). Os dois clientes Python (N3 e simulador) conectam com sessão
# limpa e client_id aleatório — ou seja, hoje o broker não guarda fila entre
# execuções; estas duas linhas só entram em ação se algum cliente passar a pedir
# sessão persistente (clean_start=False) e um client_id fixo:
persistent_client_expiration 2h
max_queued_messages 1000

# $SYS/broker/... publicado a cada 5 s (usado pelo ./broker.sh status)
sys_interval 5

# ===========================================================================
# Log
# ===========================================================================
# stdout: os logs aparecem em ./broker.sh logs (e em `podman logs`, `docker logs`).
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ===========================================================================
# Persistência (volume "dados" do compose)
# ===========================================================================
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# ===========================================================================
# Alternativa com autenticação (NÃO compatível com o framework atual)
# ===========================================================================
# Se algum dia precisar de usuário/senha, tire o "allow_anonymous true" acima,
# descomente as duas linhas abaixo e crie a lista de usuários:
#
#   podman exec -it broker-mqtt-local mosquitto_passwd -c /mosquitto/config/passwd aluno
#
# password_file /mosquitto/config/passwd
#
# Atenção: o N3 e o sketch do ESP32 não enviam usuário/senha hoje — o laço só
# volta a funcionar depois de alterar os dois para autenticar.
