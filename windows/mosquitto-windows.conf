# Mosquitto nativo no Windows — mesma configuração do repositório

Este arquivo é para o **Mosquitto instalado direto no Windows** (sem container),
usado por `windows\mosquitto-nativo.bat`. Se você usa Docker Desktop, ignore-o:
lá o que vale é `mosquitto/mosquitto.conf`, montado dentro do container.

Caminhos diferentes do arquivo do container:
- a configuração do Docker monta `mosquitto/mosquitto.conf` em
  `/mosquitto/config/` e grava em `/mosquitto/data/`;
- aqui os caminhos são do Windows (`persistence_location .\dados\`, relativo à
  pasta de onde o `mosquitto.exe` foi iniciado).

     mosquitto.exe -c windows\mosquitto-windows.conf -v

# ===========================================================================
# Rede
# ===========================================================================
# 0.0.0.0 (e não localhost) porque o Gateway ESP32 chega pela rede Wi-Fi.
listener 1883 0.0.0.0

# Sem usuário/senha: o framework (N3 e sketch) não tem campo de credenciais.
# Broker anônimo é aceitável numa rede de laboratório; NÃO exponha esta porta
# na internet (veja o README, §10).
allow_anonymous true

# -1 = conexões ilimitadas (N3, simulador, N5/N6 e o ESP32 ao mesmo tempo)
max_connections -1

# ===========================================================================
# Sessões e entrega em QoS 1
# ===========================================================================
persistent_client_expiration 2h
max_queued_messages 1000

# $SYS/broker/... publicado a cada 5 s
sys_interval 5

# ===========================================================================
# Log
# ===========================================================================
# stdout: os logs aparecem na janela do mosquitto-nativo.bat (e no -v).
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ===========================================================================
# Persistência
# ===========================================================================
# Relativo à pasta onde o mosquitto.exe foi iniciado. O mosquitto-nativo.bat
# roda com a pasta windows\ como diretório atual e cria .\dados\ antes.
# Se preferir sem persistência, troque por:  persistence false
persistence true
persistence_location .\dados\
autosave_interval 60

# ===========================================================================
# Alternativa com autenticação (NÃO compatível com o framework atual)
# ===========================================================================
# Se algum dia precisar de usuário/senha, comente "allow_anonymous true" acima,
# descomente a linha abaixo e crie a lista:
#
#   "%ProgramFiles%\mosquitto\mosquitto_passwd.exe" -c windows\passwd aluno
#
# password_file windows\passwd
#
# Atenção: o N3 e o sketch do ESP32 não enviam usuário/senha hoje — o laço só
# volta a funcionar depois de alterar os dois para autenticar.
